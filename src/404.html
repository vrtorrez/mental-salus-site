<script>
/* Endereços antigos do site anterior: leva direto à seção equivalente do site novo. */
(function () {
  var p = decodeURIComponent(location.pathname).toLowerCase();
  var map = [
    [/contato|fale/, '/#contato'],
    [/previd|rpps|consultoria|educa|servi[cç]o|programa|palestra|curso/, '/#instituicoes'],
    [/sobre|quem|empresa|historia|história/, '/#quem-somos'],
    [/equipe|time|socios|sócios/, '/#equipe'],
    [/material|livro|livreto|blog|artigo/, '/#materiais'],
    [/pro-?gest/, '/pro-gestao/']
  ];
  for (var i = 0; i < map.length; i++) { if (map[i][0].test(p)) { location.replace(map[i][1]); return; } }
})();
</script>
