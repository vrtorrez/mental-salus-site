<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<title>Página não encontrada | Mental Salus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: editorial em coluna larga, alinhado à esquerda; o Continuum da Aposentadoria
   é o elemento gráfico central; as cores dos pilares são os únicos acentos. */
:root {
  --paper: #FCFBF7;
  --paper-2: #F4F2EA;
  --ink: #293D36;
  --text: #34443F;
  --muted: #5E6A61;
  --line: #D9DED2;
  --mental: #466B68;  --mental-mid: #7E9C98;  --mental-l: #ECF2EF;
  --fisica: #666D40;  --fisica-mid: #A6AA70;  --fisica-l: #F0F2E6;
  --financ: #8B662D;  --financ-mid: #D0A249;  --financ-l: #F9F0DC;
  --on-dark: #FCFBF7;
  --serif: 'EB Garamond', Garamond, 'Times New Roman', serif;
  --sans: 'Lato', 'Helvetica Neue', Arial, sans-serif;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: clamp(1.9rem, 1.4rem + 1.8vw, 2.6rem);
  --step-4: clamp(2.6rem, 1.6rem + 4vw, 4.4rem);
  --wrap: 1120px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--paper); color: var(--text); font: 400 var(--step-0)/1.65 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
img { max-width: 100%; height: auto; display: block; }
a { color: var(--mental); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--financ-mid); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; color: var(--ink); line-height: 1.12; text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 700 0.8rem/1.3 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: var(--step-1); max-width: 40rem; color: var(--text); }
.section { padding-block: clamp(64px, 9vw, 112px); border-top: 1px solid var(--line); }
.section-head { display: grid; gap: 14px; margin-bottom: 40px; max-width: 46rem; }
.section-head h2 { font-size: var(--step-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; font: 700 1rem/1.2 var(--sans); text-decoration: none; border: 1.5px solid var(--ink); cursor: pointer; transition: background .2s, color .2s; }
.btn-dark { background: var(--ink); color: var(--on-dark); }
.btn-dark:hover { background: var(--mental); border-color: var(--mental); }
.btn-line { background: transparent; color: var(--ink); }
.btn-line:hover { background: var(--ink); color: var(--on-dark); }
.btn svg { width: 20px; height: 20px; flex: none; }

.skip { position: absolute; left: -9999px; top: 8px; z-index: 40; background: var(--ink); color: var(--on-dark); padding: 10px 14px; border-radius: 8px; }
.skip:focus { left: 16px; }

/* Cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 500 1.55rem/1 var(--serif); white-space: nowrap; }
.brand img { width: 52px; height: auto; }
.nav { display: flex; align-items: center; gap: 22px; }
.nav a { color: var(--text); text-decoration: none; font-size: 0.98rem; white-space: nowrap; }
.nav a:hover { color: var(--mental); }
.nav .btn { min-height: 44px; padding: 0 18px; font-size: 0.95rem; }
.menu-btn { display: none; background: none; border: 1.5px solid var(--line); border-radius: 10px; width: 46px; height: 46px; color: var(--ink); cursor: pointer; }
@media (max-width: 1100px) {
  .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0; background: var(--paper); border-bottom: 1px solid var(--line); padding: 8px max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
  .nav .btn { margin-top: 16px; border-bottom: 1.5px solid var(--ink); }
}

/* Abertura */
.hero { padding-block: clamp(48px, 8vw, 104px) clamp(40px, 6vw, 72px); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.9fr); gap: clamp(32px, 6vw, 80px); align-items: center; }
.hero h1 { font-size: var(--step-4); letter-spacing: -0.01em; margin: 18px 0 22px; }
.hero h1 em { font-style: italic; color: var(--financ); }
.hero .lead { margin-bottom: 32px; }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-mark { justify-self: center; display: grid; gap: 22px; justify-items: center; text-align: center; }
.hero-mark img { width: min(340px, 70vw); }
.pillars-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; font-size: 0.95rem; color: var(--muted); }
.pillars-legend span { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
@media (max-width: 820px) { .hero .wrap { grid-template-columns: 1fr; } .hero-mark { order: -1; } .hero-mark img { width: min(180px, 50vw); } }

/* Continuum */
.continuum { background: var(--paper-2); border-block: 1px solid var(--line); padding-block: clamp(48px, 7vw, 80px); }
.continuum h2 { font-size: var(--step-2); }
.cont-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 32px; margin-bottom: 36px; }
.cont-head p { max-width: 34rem; color: var(--muted); }
.phases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; }
.phases::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--mental-mid), var(--fisica-mid) 50%, var(--financ-mid)); }
.phases li { position: relative; padding: 40px 20px 0 0; min-width: 0; }
.phases li::before { content: ""; position: absolute; top: 3px; left: 0; width: 19px; height: 19px; border-radius: 50%; background: var(--paper-2); border: 3px solid var(--ink); }
.phases .when { font: 700 0.78rem/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.phases h3 { font-size: 1.35rem; margin: 6px 0 8px; }
.phases p { font-size: 0.98rem; color: var(--text); }
@media (max-width: 820px) {
  .phases { grid-template-columns: 1fr; gap: 26px; }
  .phases::before { top: 0; bottom: 0; left: 8px; right: auto; width: 3px; height: auto; background: linear-gradient(180deg, var(--mental-mid), var(--fisica-mid) 50%, var(--financ-mid)); }
  .phases li { padding: 0 0 0 40px; }
  .phases li::before { top: 4px; }
}

/* Números */
.facts { display: flex; flex-wrap: wrap; gap: 28px 64px; padding-block: 40px; }
.fact b { display: block; font: 500 2.6rem/1 var(--serif); color: var(--ink); }
.fact span { color: var(--muted); font-size: 0.98rem; }

/* Quem somos */
.about { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.about-text { display: grid; gap: 18px; }
.purpose { margin: 8px 0 0; padding: 24px 26px; background: var(--paper-2); border-radius: 18px; display: grid; gap: 8px; }
.purpose .eyebrow { color: var(--financ); }
.purpose p:last-child { font: 400 1.3rem/1.45 var(--serif); color: var(--ink); }
.principles { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.principles li { padding: 20px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.principles h3 { font-size: 1.35rem; }
.principles p { font-size: 1rem; color: var(--text); }
@media (max-width: 860px) { .about { grid-template-columns: 1fr; } }

/* Abordagem */
.concept { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: start; margin-bottom: 56px; }
.concept blockquote { margin: 0; font: italic 400 clamp(1.45rem, 1.1rem + 1.2vw, 1.9rem)/1.35 var(--serif); color: var(--ink); border-left: 3px solid var(--mental-mid); padding-left: 24px; }
.concept .body { display: grid; gap: 16px; }
@media (max-width: 820px) { .concept { grid-template-columns: 1fr; } }
.pillars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.pillar { background: var(--pc-l); border-radius: 18px; padding: 28px 26px 30px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.pillar h3 { font-size: 1.6rem; color: var(--pc); }
.pillar .leaf { width: 34px; height: 34px; color: var(--pc); }
.pillar p { font-size: 1rem; }
.p-mental { --pc: var(--mental); --pc-l: var(--mental-l); }
.p-fisica { --pc: var(--fisica); --pc-l: var(--fisica-l); }
.p-financ { --pc: var(--financ); --pc-l: var(--financ-l); }
@media (max-width: 860px) { .pillars { grid-template-columns: 1fr; } }
.note { margin-top: 28px; font-size: 0.95rem; color: var(--muted); max-width: 46rem; }

/* Instituições */
.offers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.offer { padding: 28px 28px 30px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
.offer:nth-child(odd) { border-right: 1px solid var(--line); }
.offer:nth-child(even) { padding-left: 28px; }
.offer h3 { font-size: 1.45rem; }
.tag { justify-self: start; font: 700 0.72rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--financ); background: var(--financ-l); border-radius: 999px; padding: 6px 10px; }
@media (max-width: 760px) { .offers { grid-template-columns: 1fr; } .offer:nth-child(odd) { border-right: 0; } .offer:nth-child(even) { padding-left: 0; } }
.cycle { margin-top: 44px; display: grid; gap: 14px; }
.cycle ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; counter-reset: c; }
.cycle li { counter-increment: c; display: inline-flex; align-items: center; gap: 8px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px 8px 10px; font-size: 0.98rem; color: var(--ink); }
.cycle li::before { content: counter(c); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--on-dark); font: 700 0.78rem/1 var(--sans); }
.panel-note { margin-top: 28px; display: flex; gap: 14px; align-items: flex-start; background: var(--mental-l); border-radius: 14px; padding: 18px 20px; max-width: 46rem; }
.pg-link { margin-top: 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; max-width: 46rem; padding: 20px 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper-2); text-decoration: none; color: var(--ink); transition: border-color .2s, background .2s; }
.pg-link:hover { border-color: var(--mental); background: var(--mental-l); }
.pg-text { display: grid; gap: 6px; }
.pg-title { font: 500 1.3rem/1.3 var(--serif); color: var(--ink); }
.pg-link svg { width: 24px; height: 24px; flex: none; color: var(--mental); }
.panel-note svg { width: 22px; height: 22px; flex: none; color: var(--mental); margin-top: 3px; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }

/* Servidores */
.serv { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.checks li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; }
.checks svg { width: 26px; height: 26px; color: var(--fisica); margin-top: 2px; }
.checks b { color: var(--ink); display: block; }
.access { background: var(--ink); color: var(--on-dark); border-radius: 22px; padding: 32px 30px; display: grid; gap: 16px; }
.access h3 { color: var(--on-dark); font-size: 1.8rem; }
.access p { color: color-mix(in srgb, var(--on-dark) 82%, var(--ink)); }
.access .btn-dark { background: var(--on-dark); color: var(--ink); border-color: var(--on-dark); }
.access .btn-dark:hover { background: var(--financ-mid); border-color: var(--financ-mid); }
.access a.small { color: var(--on-dark); font-size: 0.95rem; }
@media (max-width: 860px) { .serv { grid-template-columns: 1fr; } }

/* Materiais */
.materials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.feat { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); align-items: start; }
.feat-text { display: grid; gap: 14px; align-content: start; }
.feat-text h3 { font-size: var(--step-2); }
.feat-list { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.feat-list li { display: flex; gap: 10px; }
.feat-list li::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 11px; border-radius: 50%; background: var(--financ-mid); }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gallery figure { margin: 0; border-radius: 14px; overflow: hidden; background: var(--paper-2); aspect-ratio: 4 / 3; }
.gallery figure:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
.gallery img { width: 100%; height: 100%; object-fit: cover; }
.gallery .ph { width: 100%; height: 100%; display: grid; place-items: center; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 0.9rem; }
.feat details { border-top: 1px solid var(--line); padding-top: 12px; }
.feat summary { cursor: pointer; font-weight: 700; color: var(--ink); }
.feat details p, .feat details ul { margin: 10px 0 0; }
.partners { margin-top: 56px; display: grid; gap: 18px; }
.partner-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 280px)); gap: 16px; }
.partner { border: 1px solid var(--line); border-radius: 18px; background: #FFFFFF; min-height: 150px; padding: 20px; display: grid; place-items: center; transition: border-color .2s; }
a.partner[href]:hover { border-color: var(--mental); }
.feat-org { display: flex; align-items: center; gap: 14px; }
.feat-org img { height: 56px; width: auto; }
@media (max-width: 860px) { .feat { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .partner-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .partner { min-height: 120px; padding: 14px; } .partner img { max-width: 100%; max-height: 84px; width: auto !important; height: auto !important; } }
.mat { border: 1px solid var(--line); border-radius: 18px; padding: 26px; display: grid; gap: 10px; align-content: start; background: var(--paper); min-width: 0; }
.mat .kind { font: 700 0.75rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mat h3 { font-size: 1.4rem; }
.mat .act { margin-top: 8px; font-weight: 700; }
.socials { display: flex; flex-wrap: wrap; gap: 10px; }
.socials a { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 16px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 0.95rem; }
.socials a:hover { border-color: var(--ink); }
.socials svg { width: 18px; height: 18px; }
@media (max-width: 760px) { .materials { grid-template-columns: 1fr; } }

/* Equipe */
.team { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.person { display: grid; gap: 10px; align-content: start; min-width: 0; }
.avatar { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; background: var(--pc); box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--pc); }
.person h3 { font-size: 1.5rem; margin-top: 6px; }
.person .role { font-weight: 700; color: var(--pc); font-size: 0.98rem; }
.person p { font-size: 0.98rem; color: var(--muted); }
@media (max-width: 860px) { .team { grid-template-columns: 1fr; } }

/* Contato */
.contact { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.channels { display: grid; gap: 18px; }
.channel { display: grid; gap: 4px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.channel .label { font: 700 0.78rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.channel .value { font: 500 1.35rem/1.3 var(--serif); color: var(--ink); word-break: break-word; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.copy { font: 700 0.85rem/1 var(--sans); border: 1.5px solid var(--line); background: none; border-radius: 999px; padding: 8px 12px; cursor: pointer; color: var(--ink); }
form { display: grid; gap: 16px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 22px; padding: clamp(22px, 4vw, 34px); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
label { display: grid; gap: 6px; font-weight: 700; font-size: 0.95rem; color: var(--ink); }
label .opt { font-weight: 400; color: var(--muted); }
input, select, textarea { font: 400 1rem/1.4 var(--sans); color: var(--text); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; min-height: 50px; }
textarea { min-height: 130px; resize: vertical; }
.form-out { display: grid; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.form-out .links { display: flex; flex-wrap: wrap; gap: 10px; }
.form-err { color: #9A3A2A; font-weight: 700; font-size: 0.95rem; }
@media (max-width: 860px) { .contact { grid-template-columns: 1fr; } }

/* Rodapé */
footer { background: var(--ink); color: color-mix(in srgb, var(--on-dark) 80%, var(--ink)); padding-block: 56px calc(40px + env(safe-area-inset-bottom, 0px)); font-size: 0.95rem; }
footer .wrap { display: grid; gap: 28px; }
.foot-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; }
footer .brand { color: var(--on-dark); }
footer a { color: var(--on-dark); }
.foot-links { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.care { border-top: 1px solid color-mix(in srgb, var(--on-dark) 20%, var(--ink)); padding-top: 22px; display: grid; gap: 6px; }

/* WhatsApp flutuante */
.wa-float { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 25; display: inline-flex; align-items: center; gap: 10px; background: var(--fisica); color: var(--on-dark); text-decoration: none; border-radius: 999px; padding: 14px 18px; font-weight: 700; box-shadow: 0 6px 20px color-mix(in srgb, var(--ink) 25%, transparent); }
.wa-float svg { width: 22px; height: 22px; }
.wa-float:hover { background: var(--ink); }
@media (max-width: 560px) { .wa-float span { display: none; } .wa-float { padding: 15px; } }
</style>
</head>

<script>
/* Endereços antigos do site anterior: leva direto à seção equivalente do site novo. */
(function () {
  var p = decodeURIComponent(location.pathname).toLowerCase();
  var map = [
    [/contato|fale/, '/#contato'],
    [/previd|rpps|consultoria|educa|servi[cç]o|programa|palestra|curso/, '/#instituicoes'],
    [/sobre|quem|empresa|historia|história/, '/#quem-somos'],
    [/equipe|time|socios|sócios/, '/#equipe'],
    [/material|livro|livreto|blog|artigo/, '/#materiais'],
    [/pro-?gest/, '/pro-gestao/']
  ];
  for (var i = 0; i < map.length; i++) { if (map[i][0].test(p)) { location.replace(map[i][1]); return; } }
})();
</script>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/folhas-240.png" alt="" width="52" height="36">Mental Salus</a>
  </div>
</header>
<main id="conteudo">
  <section class="section" style="border-top:0">
    <div class="wrap">
      <div class="section-head">
